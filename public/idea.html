<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ý tưởng · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main>
  <h1 id="heading">Ý tưởng mới</h1>
  <p class="sub" id="sub">Ghi lại trước khi quên.</p>

  <div class="card">
    <form id="f" novalidate>
      <label for="title">Tiêu đề</label>
      <input id="title" maxlength="200" required>

      <div class="row">
        <div>
          <label for="platform">Nền tảng</label>
          <select id="platform">
            <option value="tiktok">TikTok</option>
            <option value="reels">Reels</option>
            <option value="shorts">Shorts</option>
            <option value="other">Khác</option>
          </select>
        </div>
        <div>
          <label for="status">Trạng thái</label>
          <select id="status">
            <option value="idea">Ý tưởng</option>
            <option value="scripted">Đã viết kịch bản</option>
            <option value="filmed">Đã quay</option>
            <option value="published">Đã đăng</option>
            <option value="archived">Lưu trữ</option>
          </select>
        </div>
        <div>
          <label for="niche">Niche</label>
          <input id="niche" maxlength="100" placeholder="ẩm thực, làm phim…">
        </div>
      </div>

      <label for="tags">Tag <span class="muted small">(ngăn cách bằng dấu phẩy)</span></label>
      <input id="tags" placeholder="quay phim, mẹo">

      <label for="script_outline">Dàn ý kịch bản</label>
      <textarea id="script_outline" maxlength="8000"></textarea>

      <label for="negative_prompt">
        Negative prompt
        <span class="muted small">(những gì KHÔNG được xuất hiện trong video)</span>
      </label>
      <textarea id="negative_prompt" maxlength="2000" rows="3"
                placeholder="không nhạc bản quyền, không quay mặt trẻ em, tránh cận cảnh…"></textarea>
      <p class="muted small">
        Chỉ đi vào prompt qua biến <code>{{negative_prompt}}</code>. Cố ý không tham gia
        tìm kiếm ngữ nghĩa: nhúng một danh sách cấm sẽ khiến ý tưởng khớp với đúng thứ
        nó muốn tránh.
      </p>

      <div class="actions">
        <!-- disabled sẵn; JS mở khoá khi form đã mang dữ liệu thật (ý tưởng mới thì
             mở ngay). Không có lớp này thì một cú bấm trong lúc trang còn nạp sẽ
             submit form kiểu HTML thuần: không ô nào có `name` nên query ra rỗng,
             `?id=…` bay mất, và trang nạp lại thành "Ý tưởng mới" — mất tiêu đề, mất
             khối nguồn gốc, không một thông báo nào. -->
        <button class="primary" type="submit" id="save" disabled aria-label="Lưu" title="Lưu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
        <button type="button" id="index-one" hidden aria-label="Index ý tưởng này" title="Index ý tưởng này"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></button>
        <button type="button" id="like" hidden></button>
        <button type="button" id="del" class="danger" hidden aria-label="Xoá ý tưởng" title="Xoá ý tưởng"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        <a id="to-variants" hidden><button type="button" aria-label="Biến thể của ý tưởng này" title="Biến thể của ý tưởng này"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg></button></a>
        <a href="/app"><button type="button" aria-label="Quay lại" title="Quay lại"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button></a>
      </div>
    </form>
    <p id="msg" class="msg"></p>
    <div id="dup-warn" class="msg note" hidden></div>
  </div>

  <!-- Trang này cố ý CHỈ sửa ý tưởng gốc. Biến thể quản lý ở /variants, còn ghép
       gốc + biến thể + hook thì ở /recommend — gom hai việc đó vào đây làm trang dài
       ra mà vẫn phải sang trang khác khi muốn xem toàn kho. -->

  <section id="similar-wrap" hidden>
    <h2>Ý tưởng tương tự</h2>
    <div id="similar" class="list"></div>
  </section>
</main>
<script type="module" src="/js/idea.js"></script>
</body>
</html>
