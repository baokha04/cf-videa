<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ý tưởng · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main>
  <h1 id="heading">Ý tưởng mới</h1>
  <p class="sub" id="sub">Ghi lại trước khi quên.</p>
  <p class="parent-of" id="parent-of" hidden>
    Biến thể của <a id="parent-link" href="/app">ý tưởng gốc</a>.
  </p>

  <div class="card">
    <form id="f" novalidate>
      <label for="title">Tiêu đề</label>
      <input id="title" maxlength="200" required>

      <label for="hook">Hook <span class="muted small">(3 giây đầu giữ chân người xem)</span></label>
      <input id="hook" maxlength="500">

      <div class="row">
        <div>
          <label for="platform">Nền tảng</label>
          <select id="platform">
            <option value="tiktok">TikTok</option>
            <option value="reels">Reels</option>
            <option value="shorts">Shorts</option>
            <option value="other">Khác</option>
          </select>
        </div>
        <div>
          <label for="status">Trạng thái</label>
          <select id="status">
            <option value="idea">Ý tưởng</option>
            <option value="scripted">Đã viết kịch bản</option>
            <option value="filmed">Đã quay</option>
            <option value="published">Đã đăng</option>
            <option value="archived">Lưu trữ</option>
          </select>
        </div>
        <div>
          <label for="niche">Niche</label>
          <input id="niche" maxlength="100" placeholder="ẩm thực, làm phim…">
        </div>
      </div>

      <label for="tags">Tag <span class="muted small">(ngăn cách bằng dấu phẩy)</span></label>
      <input id="tags" placeholder="quay phim, mẹo">

      <label for="source_idea">Ý tưởng gốc
        <span class="muted small">(bản thô, giữ nguyên văn để còn đối chiếu)</span></label>
      <textarea id="source_idea" maxlength="8000" rows="4"></textarea>

      <label for="script_outline">Dàn ý kịch bản</label>
      <textarea id="script_outline" maxlength="8000"></textarea>

      <label for="prompt_recipe">Prompt công thức
        <span class="muted small">(viết một lần, dán lại cho mọi biến thể)</span></label>
      <textarea id="prompt_recipe" maxlength="4000" rows="4"></textarea>

      <label for="negative_prompt">Negative prompt
        <span class="muted small">(thứ KHÔNG được xuất hiện)</span></label>
      <textarea id="negative_prompt" maxlength="2000" rows="3"></textarea>

      <div class="actions">
        <button class="primary" type="submit" id="save">Lưu</button>
        <button type="button" id="sync" hidden>Đồng bộ index</button>
        <button type="button" id="like" hidden></button>
        <button type="button" id="del" class="danger" hidden>Xoá</button>
        <a href="/app"><button type="button">Quay lại</button></a>
      </div>
    </form>
    <p id="msg" class="msg"></p>
  </div>

  <!-- Danh mục video hook. Mỗi mục có id riêng nên sửa và xoá được từng dòng, khác
       hẳn một ô nhiều dòng vốn ghi đè cả danh mục mỗi lần lưu.

       Hiện cả trên trang tạo mới: lúc đó ý tưởng chưa có id nên các dòng sống tạm
       trong bộ nhớ và đi kèm lần POST tạo ý tưởng (xem pendingHooks trong idea.js).
       Ẩn nó đi cho tới khi lưu xong là lấy mất một thứ vốn nhập được ngay trong
       form, và không ai đoán ra được là nó có tồn tại. -->
  <section id="hooks-wrap" hidden>
    <h2>Danh mục video hook</h2>
    <p class="sub" id="hooks-sub">Các cách mở đầu đã nghĩ ra cho ý tưởng này.</p>
    <div class="card">
      <div id="hook-list"></div>
      <div class="row hook-add-row">
        <div>
          <label for="hook-new">Thêm hook</label>
          <input id="hook-new" maxlength="500" placeholder="Bạn đã bao giờ…">
        </div>
        <div class="shrink">
          <label>&nbsp;</label>
          <button type="button" id="hook-add">Thêm</button>
        </div>
      </div>
      <p class="small muted spaced" id="hooks-note"></p>
    </div>
  </section>

  <!-- Danh mục ý tưởng biến thể. Mục này LUÔN hiện; khi chưa dùng được (ý tưởng
       chưa lưu, hoặc đang mở chính một biến thể) thì nút mờ đi kèm một câu giải
       thích, chứ không ẩn cả mục — ẩn đi thì người dùng không tìm ra chỗ thêm mới
       và cũng không có gì nói cho họ biết vì sao. -->
  <section id="variants-wrap" hidden>
    <h2>Ý tưởng biến thể</h2>
    <p class="sub" id="variants-sub">Các bản mọc ra từ ý tưởng gốc này.</p>
    <div class="actions">
      <button type="button" id="new-variant">+ Tạo biến thể từ ý tưởng này</button>
    </div>
    <div id="variants" class="list"></div>
  </section>

  <section id="similar-wrap" hidden>
    <h2>Ý tưởng tương tự</h2>
    <div id="similar" class="list"></div>
  </section>
</main>
<script type="module" src="/js/idea.js"></script>
</body>
</html>
