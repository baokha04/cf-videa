<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tài khoản · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main>
  <h1>Tài khoản</h1>
  <p class="sub" id="whoami"></p>

  <h2>Đổi mật khẩu</h2>
  <div class="card">
    <form id="pw" novalidate>
      <label for="current_password">Mật khẩu hiện tại</label>
      <input id="current_password" type="password" autocomplete="current-password" required>

      <label for="new_password">Mật khẩu mới</label>
      <input id="new_password" type="password" autocomplete="new-password"
             minlength="10" maxlength="200" required>
      <p class="small muted">
        Tối thiểu 10 ký tự. Đổi mật khẩu sẽ đăng xuất mọi thiết bị khác.
      </p>

      <div class="actions">
        <button class="primary" type="submit" id="pwsave" disabled aria-label="Đổi mật khẩu" title="Đổi mật khẩu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg></button>
      </div>
    </form>
    <p id="pwmsg" class="msg"></p>
  </div>

  <h2>Phiên đăng nhập</h2>
  <div class="card">
    <table>
      <thead>
        <tr><th>Thiết bị</th><th>Hoạt động gần nhất</th><th></th></tr>
      </thead>
      <tbody id="sessions"><tr><td colspan="3" class="muted">Đang tải…</td></tr></tbody>
    </table>
    <div class="actions">
      <button type="button" id="revokeall" aria-label="Đăng xuất mọi thiết bị khác" title="Đăng xuất mọi thiết bị khác"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
      <button type="button" id="logout" class="danger" aria-label="Đăng xuất" title="Đăng xuất"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <p id="smsg" class="msg"></p>
  </div>
</main>
<script type="module" src="/js/account.js"></script>
</body>
</html>
