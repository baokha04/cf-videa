<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main class="narrow">
  <h1>cf-videa</h1>
  <p class="sub">Đang chuyển hướng…</p>
  <p><a href="/login">Đăng nhập</a> · <a href="/register">Đăng ký</a></p>
</main>
<script type="module">
  import { get } from '/js/api.js';
  // redirectOn401 = false: ở đây 401 là câu trả lời hợp lệ ("chưa đăng nhập"),
  // không phải lỗi cần đá về trang login kèm ?next.
  get('/api/auth/me').then(
    () => location.replace('/app'),
    () => location.replace('/login'),
  );
</script>
</body>
</html>
