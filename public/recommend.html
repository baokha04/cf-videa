<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gợi ý · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">

<script src="/js/theme-init.js"></script>
</head>
<body>
<main>
  <h1>Khơi lại ý tưởng cũ</h1>
  <!--
    Nói đúng điều tính năng này làm. Mọi ý tưởng đều riêng tư của tác giả, nên
    gợi ý chỉ có thể lôi lại ý tưởng CỦA CHÍNH BẠN mà bạn chưa thích — nó không
    khám phá ý tưởng mới từ người khác.
  -->
  <p class="sub">
    Dựa trên những ý tưởng bạn đã thích, đây là các ý tưởng khác trong kho của bạn
    đi cùng hướng mà bạn chưa để mắt tới.
  </p>

  <p id="msg" class="msg"></p>
  <div id="list" class="list"><p class="empty">Đang tải…</p></div>

<script type="module" src="/js/recommend.js"></script>
