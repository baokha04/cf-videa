<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tìm kiếm · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main>
  <h1>Tìm kiếm ngữ nghĩa</h1>
  <p class="sub">Mô tả điều bạn đang nghĩ tới — không cần trùng từ khoá.</p>

  <div class="card">
    <form id="f">
      <div class="row">
        <div>
          <label for="q">Bạn đang tìm gì?</label>
          <input id="q" type="search" required
                 placeholder="ví dụ: công thức ăn lành mạnh làm nhanh buổi sáng">
        </div>
        <div class="shrink">
          <label>&nbsp;</label>
          <button class="primary" type="submit" id="go" disabled>Tìm</button>
        </div>
      </div>
    </form>
    <p id="msg" class="msg"></p>
  </div>

  <div id="list" class="list"></div>
</main>
<script type="module" src="/js/search.js"></script>
</body>
</html>
