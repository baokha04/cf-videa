<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép nội dung tràn ra sát mép màn hình iPhone; CSS
     dùng env(safe-area-inset-*) để tránh Dynamic Island và thanh home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Đăng nhập · cf-videa</title>
<link rel="stylesheet" href="/css/app.css">
<!-- Đồng bộ, KHÔNG defer: phải áp giao diện trước khung hình đầu tiên để không nháy. -->
<script src="/js/theme-init.js"></script>
</head>
<body>
<main class="narrow">
  <div class="topbar" id="themebar"></div>
  <h1>Đăng nhập</h1>
  <p class="sub">Kho ý tưởng short video của bạn.</p>
  <div class="card">
    <form id="f" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <label class="check" for="remember">
        <input id="remember" name="remember" type="checkbox">
        <span>
          Ghi nhớ đăng nhập
          <span class="hint">Bỏ trống nếu đang dùng máy chung — đóng trình duyệt là tự đăng xuất.</span>
        </span>
      </label>

      <div class="actions">
        <button class="primary" type="submit" id="submit" disabled>Đăng nhập</button>
      </div>
    </form>
    <p id="msg" class="msg"></p>
  </div>
  <p class="small muted spaced">
    Chưa có tài khoản? <a href="/register">Đăng ký</a>
  </p>
</main>
<script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
